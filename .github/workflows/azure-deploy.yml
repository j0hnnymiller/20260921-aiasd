name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }} # set repo variable to your App Service name
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # Install on the same OS as the App Service Linux runtime so the
      # better-sqlite3 native binary matches the deployment target.
      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Syntax check
        run: npm run check

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: |
            .
            !node_modules/.cache
            !ai-logs
            !.git

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-step.outputs.webapp-url }}
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: .

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        id: deploy-step
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Azure logout
        run: az logout
        if: always()
